server:
  port: 8083

spring:
  application:
    name: ai4kb-backend
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:infini_rag_flow}
      database: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 支持通过环境变量配置 Host/Port，默认值为 localhost:3307 (本地开发)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/ai4kb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: infini_rag_flow
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# RAGFlow Configuration
ragflow:
  # 支持通过环境变量配置 Base URL，默认值为 localhost:8084
  base-url: ${RAGFLOW_BASE_URL:http://localhost:8084}
  # This API Key should be a system-level admin key for RAGFlow
  # You can get it from RAGFlow UI or database
  api-key: ${RAGFLOW_API_KEY:ragflow-system-admin-key}

# Engine LLM Configuration
ai4kb:
  auth:
    jwt-secret: ${AI4KB_JWT_SECRET:ai4kb-dev-jwt-secret-change-me}
    token-ttl-seconds: ${AI4KB_TOKEN_TTL_SECONDS:28800}
    legacy-default-password: ${AI4KB_LEGACY_DEFAULT_PASSWORD:ChangeMe123!}
  llm:
    base-url: ${LLM_BASE_URL:http://localhost:8085/v1}
    api-key: ${LLM_API_KEY:empty}
    model: ${LLM_MODEL:deepseek-r1-distill-qwen-14b-custom}
  router:
    tool-confidence-threshold: ${ROUTER_TOOL_CONFIDENCE_THRESHOLD:0.55}
    clarify-confidence-threshold: ${ROUTER_CLARIFY_CONFIDENCE_THRESHOLD:0.45}
    race-confidence-threshold: ${ROUTER_RACE_CONFIDENCE_THRESHOLD:0.75}
    local-router-enabled: ${ROUTER_LOCAL_ROUTER_ENABLED:false}
    local-router-auto-threshold: ${ROUTER_LOCAL_ROUTER_AUTO_THRESHOLD:0.90}
  processor:
    # Options: "rag" (default, calls RAGFlow), "agent" (mock for Phase 2)
    mode: ${PROCESSOR_MODE:agent}


logging:
  level:
    com.ai4kb.backend: DEBUG
